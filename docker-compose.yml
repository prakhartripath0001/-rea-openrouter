services:
  postgres:
    image: postgres:16-alpine
    container_name: openrouter-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-openrouter_clone}
      POSTGRES_USER: ${DB_USER:-openrouter_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - openrouter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openrouter_app} -d ${DB_NAME:-openrouter_clone}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  openrouter-postgres-data:
