services:
  postgres:
    image: postgres:16-alpine
    container_name: openrouter-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrouter_clone}
      POSTGRES_USER: ${POSTGRES_USER:-openrouter_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openrouter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrouter_app} -d ${POSTGRES_DB:-openrouter_clone}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  openrouter-postgres-data:
