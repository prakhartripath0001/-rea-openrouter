server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: openrouter-clone-catalogue-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openrouter_clone}
    username: ${DB_USER:openrouter_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 32
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    org.hibernate.SQL: warn
